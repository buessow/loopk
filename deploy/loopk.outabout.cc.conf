<VirtualHost 172.31.23.241:443>
    ServerName loopk.outabout.cc

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/outabout.cc/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/outabout.cc/privkey.pem

    RequestHeader set X-Forwarded-Proto "https"

    # Socket.IO upgrades its /storage namespace to WebSocket after the
    # normal polling handshake.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8084/$1 [P,L]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/

    ErrorLog  /usr/local/apache2/logs/loopk.outabout.cc-error.log
    CustomLog /usr/local/apache2/logs/loopk.outabout.cc-access.log combined
</VirtualHost>
