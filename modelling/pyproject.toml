[project]
name = "glupred"
version = "0.1.0"
description = "Glucose prediction training and evaluation for loopk"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "psycopg[binary]>=3.2",
  "scikit-learn>=1.5",
  "tabulate>=0.9",
  "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
